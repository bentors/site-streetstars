    <style>
      html, body {
        background-color: #000000; 
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;

    </style>

    <title>Street Stars | Estrelas nascem nas ruas</title>
    <meta name="description" content="Street Stars é uma marca de moda streetwear que nasce da rua, da cultura e da expressão individual. Conheça a loja oficial." />

    <link rel="canonical" href="https://streetstars.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://streetstars.vercel.app/">

    <meta property="og:image" content="./assets/images/logo.webp" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Street Stars" />

    <body>
      <div id="root">
        <div style="
          position: relative;
          height: 100vh;
          width: 100vw;
          background-color: #000;
          background-image: url('https://res.cloudinary.com/dmsvju9ca/image/upload/f_auto,q_auto,w_600,dpr_2.0/v1769638546/hero_rb9jvq.jpg');
          background-size: cover;
          background-position: 55% 65%;
          background-repeat: no-repeat;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          color: white;
          font-family: sans-serif;
          overflow: hidden;
        ">
          
          <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.65), rgba(0,0,0,0.55), rgba(0,0,0,0.65));"></div>

          <div style="position: relative; z-index: 10; text-align: center;">
            <p style="font-size: 12px; letter-spacing: 0.35em; opacity: 0.6; margin-bottom: 24px;">STREET STARS</p>
            <h1 style="font-size: 36px; font-weight: 900; line-height: 1.1; text-transform: uppercase; margin: 0 0 40px 0;">ESTRELAS NASCEM<br>NAS RUAS</h1>
            
            <div class="loader"></div>
          </div>

          <style>
            .loader {
              width: 24px; height: 24px; margin: 0 auto;
              border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff;
              border-radius: 50%; animation: spin 1s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }

            @media (min-width: 769px) {
              #root > div {
                background-image: url('https://res.cloudinary.com/dmsvju9ca/image/upload/f_auto,q_auto,w_1500/v1769638546/hero_rb9jvq.jpg') !important;
                background-position: 50% 18% !important;
              }
              #root h1 { font-size: 64px !important; }
            }
          </style>
        </div>
      </div>

      <script type="module" src="/src/main.jsx"></script>
      
      <style>body { margin: 0; background-color: #000; }</style>
  </body>
