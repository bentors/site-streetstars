<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link 
      rel="preload" 
      as="image" 
      href="https://res.cloudinary.com/dmsvju9ca/image/upload/f_auto,q_auto,c_limit,dpr_auto,w_600,q_auto/v1769638546/hero_rb9jvq.jpg"
      media="(max-width: 768px)"
    > 
    <link 
      rel="preload" 
      as="image" 
      href="https://res.cloudinary.com/dmsvju9ca/image/upload/f_auto,q_auto,c_limit,dpr_auto,w_1500,q_auto/v1769638546/hero_rb9jvq.jpg"
      media="(min-width: 769px)"
    >

    <title>Street Stars | Estrelas nascem nas ruas</title>
    
    <style>
      #root {
        min-height: 100vh;
        width: 100%;
        display: block;
        background-color: #000;
      }

      body { 
        margin: 0; 
        background-color: #000; 
        color: #fff;
        font-family: sans-serif;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease-out;
      }

      .loader-brand {
        font-size: 14px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 20px;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top: 2px solid #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .loader-hidden {
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;
        z-index: -1 !important;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <span class="loader-brand">Street Stars</span>
        <div class="spinner"></div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.removeLoader = () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('loader-hidden');
          setTimeout(() => {
            loader.remove();
          }, 500);
        }
      }
    </script>
  </body>
</html>
